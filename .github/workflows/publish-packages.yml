# Publishes @agentmoney/wallet-mcp and @agentmoney/seller-sdk to npm with
# provenance, authenticated via OIDC trusted publishing — no long-lived npm
# token exists anywhere in this repository or its secrets.
#
# Triggers:
#   - Tag push `wallet-mcp-v<version>`  -> publishes @agentmoney/wallet-mcp
#   - Tag push `seller-sdk-v<version>`  -> publishes @agentmoney/seller-sdk
#   - workflow_dispatch                 -> DRY RUN ONLY (never publishes);
#     builds, gates, runs `npm publish --dry-run`, uploads the tarball(s)
#     as artifacts for inspection.
#
# One-time npmjs.com setup (per package) is documented in
# docs/RELEASING-PACKAGES.md. Summary: package Settings -> Trusted publisher
# -> GitHub Actions -> user `MaxwellCalkin`, repository `money`, workflow
# filename `publish-packages.yml`, environment `npm-publish`. Trusted
# publishing requires npm >= 11.5.1 (asserted below) and a GitHub-hosted
# runner; provenance additionally requires this repository to be public.
#
# File destination in the repo: .github/workflows/publish-packages.yml
# (the filename is load-bearing — it must match the npm trusted-publisher
# configuration exactly, case-sensitive).

name: publish-packages

on:
  push:
    tags:
      - "wallet-mcp-v*"
      - "seller-sdk-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to DRY-RUN (manual runs never publish)"
        type: choice
        options:
          - both
          - wallet-mcp
          - seller-sdk
        default: both

permissions:
  contents: read

# Never cancel a publish mid-flight; queue instead.
concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.resolve.outputs.packages }}
      version: ${{ steps.resolve.outputs.version }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the not-on-main tag guard can run merge-base.
          fetch-depth: 0

      - name: Refuse tags that do not point at main history
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::tag $TAG points at $SHA which is not an ancestor of origin/main — refusing to publish" >&2
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
          package-manager-cache: true

      - name: Resolve release target from tag (or dispatch input)
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          PACKAGE_INPUT: ${{ inputs.package }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode=dry-run
            case "$PACKAGE_INPUT" in
              wallet-mcp) packages='["wallet-mcp"]' ;;
              seller-sdk) packages='["seller-sdk"]' ;;
              both)       packages='["wallet-mcp","seller-sdk"]' ;;
              *) echo "::error::unknown package input: $PACKAGE_INPUT"; exit 1 ;;
            esac
            version="$(node -p 'require("./package.json").version')"
          else
            mode=publish
            case "$TAG" in
              wallet-mcp-v*|seller-sdk-v*) ;;
              *) echo "::error::unexpected tag: $TAG"; exit 1 ;;
            esac
            pkg="${TAG%-v*}"
            version="${TAG##*-v}"
            manifest_version="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$version" != "$manifest_version" ]; then
              echo "::error::tag says $version but packages/$pkg/package.json says $manifest_version — fix the version lockstep before tagging" >&2
              exit 1
            fi
            packages="[\"$pkg\"]"
          fi
          {
            printf 'packages=%s\n' "$packages"
            printf 'version=%s\n' "$version"
            printf 'mode=%s\n' "$mode"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode packages=$packages version=$version"

      - run: npm ci --no-audit --no-fund

      - name: Build both publishable packages from src/
        run: npm run build:packages

      # The release gate: shebang + dependency-closure guards, manifest
      # agreement, seller d.ts alignment, and version lockstep with the MCP
      # server's advertised version (test/packages-build.test.ts).
      - name: Run the packages-build gate
        run: npm test -- test/packages-build.test.ts --reporter=dot

  dry-run:
    needs: gate
    if: needs.gate.outputs.mode == 'dry-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        package: ${{ fromJSON(needs.gate.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
          package-manager-cache: true
      - run: npm ci --no-audit --no-fund
      - name: Dry-run publish (prepack rebuilds dist from src/)
        working-directory: packages/${{ matrix.package }}
        run: npm publish --dry-run --access public
      - name: Pack tarball for inspection
        working-directory: packages/${{ matrix.package }}
        run: npm pack
      - name: Retain tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}-${{ needs.gate.outputs.version }}-tarball
          path: packages/${{ matrix.package }}/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: gate
    if: needs.gate.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Must match the "Environment name" field in the npm trusted-publisher
    # configuration (case-sensitive). Add required reviewers to this
    # environment in repo Settings -> Environments for a manual approval
    # gate before every publish.
    environment: npm-publish
    permissions:
      contents: read
      # Required: lets npm mint a short-lived OIDC credential and generate
      # the provenance attestation. There is no NODE_AUTH_TOKEN anywhere.
      id-token: write
    strategy:
      matrix:
        package: ${{ fromJSON(needs.gate.outputs.packages) }}
      max-parallel: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deliberately no `registry-url` input: it writes an .npmrc that
      # expects NODE_AUTH_TOKEN. Trusted publishing needs neither.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
          package-manager-cache: true

      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: |
          required="11.5.1"
          current="$(npm --version)"
          echo "npm $current (need >= $required)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $current is older than $required; bump setup-node's node-version to a release that bundles a newer npm" >&2
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      # prepack (node ../../scripts/build-packages.mjs) rebuilds dist/ from
      # src/ during publish, so a stale checkout can never ship. Auth is the
      # OIDC exchange; --provenance is explicit belt-and-braces (trusted
      # publishing generates attestations automatically, but the flag makes
      # the intent auditable and fails loudly if provenance is impossible).
      - name: Publish ${{ matrix.package }} to npm with provenance
        working-directory: packages/${{ matrix.package }}
        run: npm publish --provenance --access public

      - name: Verify the registry serves the new version
        env:
          PKG: ${{ matrix.package }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            if [ "$(npm view "@agentmoney/${PKG}@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
              echo "registry serves @agentmoney/${PKG}@${VERSION}"
              exit 0
            fi
            echo "attempt ${attempt}: not visible yet, retrying in 10s"
            sleep 10
          done
          echo "::error::@agentmoney/${PKG}@${VERSION} not visible on the registry after 2 minutes" >&2
          exit 1

  # Lists @agentmoney/wallet-mcp on the official MCP registry
  # (https://registry.modelcontextprotocol.io) once npm serves the version.
  # Ordering is load-bearing: the registry validates the published npm
  # tarball (its package.json must carry `mcpName` equal to server.json's
  # `name`, at the same version) before it accepts a listing, so this job
  # runs strictly after the publish job's `npm view` poll. Auth is GitHub
  # OIDC: the registry grants `io.github.<repository_owner>/*` from the
  # token's claim verbatim and matches it as a case-sensitive prefix, hence
  # `io.github.MaxwellCalkin/...` (the GitHub login's exact case) in both
  # files. continue-on-error: a registry outage must never retro-fail a
  # completed npm publish — the run stays green and the job is re-run from
  # the Actions UI once the registry is back (a duplicate-version response
  # on that re-run is treated as success below).
  registry:
    needs: [gate, publish]
    if: needs.gate.outputs.mode == 'publish' && startsWith(github.ref_name, 'wallet-mcp-v')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Required: lets mcp-publisher exchange the runner's OIDC token for a
      # short-lived registry token. No registry credential exists anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Pinned by version AND sha256 (from registry_1.8.1_checksums.txt on
      # the release page). Never /releases/latest/: an unpinned binary that
      # holds an OIDC-minted token is exactly the kind of supply-chain step
      # the rest of this workflow refuses to have.
      - name: Install mcp-publisher v1.8.1 (sha256-pinned)
        env:
          PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --retry-delay 5 -o mcp-publisher.tar.gz "$PUBLISHER_URL"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      # The listing must agree with the tarball the registry is about to
      # read, and with the tag that drove this run.
      - name: Guard server.json against package.json and the tag
        working-directory: packages/wallet-mcp
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          test "$(jq -r .name server.json)" = "$(jq -r .mcpName package.json)"
          jq -e --arg v "$VERSION" '.version == $v and .packages[0].version == $v' server.json
          test "$(jq -r '.packages[0].identifier' server.json)" = "$(jq -r .name package.json)"
          echo "server.json: $(jq -r .name server.json)@$(jq -r .version server.json) -> $(jq -r '.packages[0].identifier' server.json)"

      - name: Authenticate to the MCP registry (GitHub OIDC)
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc

      # The registry refuses a version it already lists with
      # "invalid version: cannot publish duplicate version: <name>@<v>
      # already exists"; on a re-run of this job that is the desired state.
      - name: Publish server.json to the MCP registry
        working-directory: packages/wallet-mcp
        run: |
          set +e
          "$RUNNER_TEMP/mcp-publisher" publish 2>&1 | tee "$RUNNER_TEMP/mcp-publish.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q -E 'cannot publish duplicate version|already exists' "$RUNNER_TEMP/mcp-publish.log"; then
              echo "registry already lists this version; treating the re-run as success"
              exit 0
            fi
            echo "::error::mcp-publisher publish failed (exit $status); the npm publish stands - re-run this job once the registry is healthy" >&2
            exit "$status"
          fi

      - name: Verify the registry lists the wallet
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          NAME: io.github.MaxwellCalkin/wallet-mcp
        run: |
          for attempt in $(seq 1 6); do
            body="$(curl -sSf "https://registry.modelcontextprotocol.io/v0.1/servers?search=${NAME}")" || body=""
            if printf '%s' "$body" | grep -q -F "$NAME" && printf '%s' "$body" | grep -q -F "$VERSION"; then
              echo "registry lists ${NAME}@${VERSION}"
              exit 0
            fi
            echo "attempt ${attempt}: not visible yet, retrying in 10s"
            sleep 10
          done
          echo "::warning::${NAME}@${VERSION} not visible in the registry search after 1 minute (the publish step succeeded; indexing may lag)" >&2
          exit 1
