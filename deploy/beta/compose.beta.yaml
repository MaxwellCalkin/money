# Hosted beta topology — see deploy/beta/README.md for posture and setup.
# Runs the beta image (no production marker; development posture) with
# invite-gated signup and play-dollar funding. Sized for 2 OCPU / 12 GB.
services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: money
      POSTGRES_PASSWORD: ${BETA_DB_PASSWORD:?set in beta.env}
      POSTGRES_DB: money
      POSTGRES_INITDB_ARGS: --data-checksums
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=80"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money -d money"]
      interval: 10s
      timeout: 5s
      retries: 6

  pgbouncer:
    image: percona/percona-pgbouncer:1.25.2
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: money
      DB_PASSWORD: ${BETA_DB_PASSWORD:?set in beta.env}
      POOL_MODE: transaction
      LISTEN_PORT: "6432"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: ../..
      dockerfile: deploy/beta/Dockerfile.beta
    restart: "no"
    command: ["dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://money:${BETA_DB_PASSWORD}@postgres:5432/money
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot role convergence: applies db/roles.sql after migrations and binds
  # the passworded money_metrics_login the public-metrics service connects as.
  # That service is the only internet-reachable process with zero request
  # authentication, so it never holds the owner login — its database identity
  # can execute exactly two aggregate functions and select from no table.
  roles:
    image: postgres:18.4
    restart: "no"
    entrypoint: ["/bin/sh", "/apply-roles.sh"]
    environment:
      ADMIN_DATABASE_URL: postgres://money:${BETA_DB_PASSWORD}@postgres:5432/money
      BETA_METRICS_DB_PASSWORD: ${BETA_METRICS_DB_PASSWORD:?set in beta.env}
    volumes:
      - ../../db/roles.sql:/roles.sql:ro
      - ./apply-roles.sh:/apply-roles.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: deploy/beta/Dockerfile.beta
    restart: unless-stopped
    command: ["dist/server/postgres-api.js"]
    env_file: beta.env
    environment:
      DATABASE_URL: postgres://money:${BETA_DB_PASSWORD}@pgbouncer:6432/money
      MONEY_BIND_HOST: 0.0.0.0
      MONEY_ALLOW_DEV_FUNDING: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4021/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  external-worker:
    build:
      context: ../..
      dockerfile: deploy/beta/Dockerfile.beta
    restart: unless-stopped
    command: ["dist/db/external-worker.js"]
    environment:
      MONEY_WORKER_DATABASE_URL: postgres://money:${BETA_DB_PASSWORD}@pgbouncer:6432/money
    depends_on:
      migrate:
        condition: service_completed_successfully

  database-ops:
    build:
      context: ../..
      dockerfile: deploy/beta/Dockerfile.beta
    restart: unless-stopped
    command: ["dist/server/database-ops.js"]
    environment:
      DATABASE_URL: postgres://money:${BETA_DB_PASSWORD}@postgres:5432/money
      MONEY_OPS_TOKEN: ${MONEY_OPS_TOKEN:?set in beta.env}
      MONEY_BIND_HOST: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Card authorization ingress (sandbox). Answers issuer authorization
  # webhooks on /webhooks/<provider>/authorization via the Caddy /webhooks/*
  # route. Under MONEY_CARD_PROVIDER=mock (set in beta.env) no real issuer
  # ever calls this; the route exists so the hosted topology matches
  # production and so a later stripe-issuing test-mode flip is one env edit.
  card-authorization:
    build:
      context: ../..
      dockerfile: deploy/beta/Dockerfile.beta
    restart: unless-stopped
    command: ["dist/cards/authorization-server.js"]
    env_file: beta.env
    environment:
      MONEY_CARD_INGRESS_DATABASE_URL: postgres://money:${BETA_DB_PASSWORD}@pgbouncer:6432/money
      MONEY_BIND_HOST: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4027/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Card event worker (sandbox). CAVEAT, stated plainly: under provider
  # `mock` this standalone process boots a fresh, empty in-process mock
  # issuer that shares no state with the API's mock issuer, so any event
  # that does land in the card inbox will fail its issuer re-fetch, retry,
  # and eventually dead-letter — which trips the treasury breaker by design
  # (fail closed on evidence we cannot re-fetch). In the beta nothing
  # enqueues card events (the mock purchase network exists only in tests and
  # `npm run demo:card`), so the inbox stays empty; the full mock card loop
  # is only meaningful in one process. This service is here so the sandbox
  # topology and env contract match production, and it becomes load-bearing
  # the moment the profile flips to Stripe test mode.
  card-events:
    build:
      context: ../..
      dockerfile: deploy/beta/Dockerfile.beta
    restart: unless-stopped
    command: ["dist/cards/event-worker.js"]
    env_file: beta.env
    environment:
      MONEY_CARD_WORKER_DATABASE_URL: postgres://money:${BETA_DB_PASSWORD}@pgbouncer:6432/money
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Public wash-proof metrics (sandbox). Serves aggregates, the funding
  # lineage split, retention cohorts, weekly receipt chain roots, and receipt
  # inclusion verification on /metrics and /receipts via Caddy. Deliberately
  # unauthenticated on the wire, which is exactly why it connects as the
  # two-function money_metrics_login (bound by the roles job) and never as
  # the owner: a compromised public process can read nothing account-level.
  # It talks to postgres directly — pgbouncer authenticates only the owner
  # user, and this service issues one aggregate query per minute.
  # The page itself carries the "sandbox, no real funds" banner and publishes
  # honest zeroes.
  public-metrics:
    build:
      context: ../..
      dockerfile: deploy/beta/Dockerfile.beta
    restart: unless-stopped
    command: ["dist/server/metrics.js"]
    environment:
      MONEY_METRICS_DATABASE_URL: postgres://money_metrics_login:${BETA_METRICS_DB_PASSWORD}@postgres:5432/money
      MONEY_METRICS_SANDBOX_LABEL: ${MONEY_METRICS_SANDBOX_LABEL:-true}
      MONEY_BIND_HOST: 0.0.0.0
    depends_on:
      roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4028/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      BETA_HOSTNAME: ${BETA_HOSTNAME:?set in beta.env}
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
